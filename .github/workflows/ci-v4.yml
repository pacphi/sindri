name: "v4: CI"

# v4 (Rust, redesigned) — promoted from research/v4 during April 2026 reorg.
# This workflow lives on `main` and triggers only on push/PR to the `v4` branch.
# Cross-platform matrix preserved from research/v4:.github/workflows/ci.yml.

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  tier: 1 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, tier: 1 }
          - { os: macos-14,         target: aarch64-apple-darwin,      tier: 1 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    tier: 1 }
          # Placeholder: when GitHub provisions the `ubuntu-26.04-arm`
          # hosted runner, add it here as:
          #   - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, tier: 1 }
          # The monitor workflow `.github/workflows/monitor-ubuntu-2604-arm.yml`
          # probes for availability weekly and auto-PRs that change.
          # (GHA matrix can't conditionally include rows, and job-level `if`
          # can't see `matrix` context — so we keep the slot as a comment.)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v4/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('v4/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build workspace
        working-directory: v4
        run: cargo build --release --workspace
      - name: Run tests
        working-directory: v4
        run: cargo test --workspace
      - name: Clippy (no warnings)
        working-directory: v4
        run: cargo clippy --workspace -- -D warnings
      - name: Generated docs are fresh (target-trait + schemas)
        # Runs only on Linux — these checks parse Rust source and write
        # markdown / JSON, both of which are platform-independent. Matrix
        # symmetry is preserved by gating on os only here.
        if: matrix.os == 'ubuntu-latest'
        working-directory: v4
        run: |
          cargo run -p target-doc-gen -- --check
          cargo run -p schema-gen -- --check
      - name: Smoke install test (local registry)
        working-directory: v4
        shell: bash
        run: |
          cp target/release/sindri* /tmp/ 2>/dev/null || cp target/release/sindri /tmp/ 2>/dev/null || true
          /tmp/sindri registry refresh core "registry:local:registry-core"
          /tmp/sindri ls
          /tmp/sindri validate /dev/null 2>/dev/null || true  # exits 4 as expected

  build-windows-arm:
    name: Build Windows ARM64 (Tier 2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - name: Cross-compile (build only)
        working-directory: v4
        run: cargo build --target aarch64-pc-windows-msvc --workspace


  # ============================================
  # Dependency Audit (SECURITY.md, "Dependency auditing")
  # ============================================
  # Same job name on every supported branch, so one required check covers them all.
  # Exceptions live only in v4/.cargo/audit.toml, which cargo-audit reads from v4/.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0

      - name: Install cargo-audit 0.22.2
        run: |
          cargo binstall --no-confirm --locked cargo-audit@0.22.2
          cargo audit --version

      # The verdict comes from the human-readable run; the JSON run (same flags, no re-fetch)
      # feeds the SARIF upload. Both files are written under the workspace so hashFiles() sees them.
      - name: cargo audit --deny warnings
        working-directory: v4
        shell: bash
        run: |
          set -euo pipefail
          args=(--deny warnings)
          # transitional: honour a legacy v4/audit-ignore (one advisory ID per line) in addition
          # to .cargo/audit.toml. Remove once no supported branch carries an audit-ignore file.
          if [[ -f audit-ignore ]]; then
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="$(xargs <<<"$line")"
              [[ -z "$line" ]] && continue
              args+=(--ignore "$line")
            done <audit-ignore
            echo "::notice::transitional: also ignoring the IDs listed in v4/audit-ignore"
          fi
          echo "cargo audit ${args[*]}"
          rc=0
          cargo audit "${args[@]}" || rc=$?
          cargo audit --no-fetch --json "${args[@]}" >"$GITHUB_WORKSPACE/cargo-audit.json" || true
          exit "$rc"

      - name: Convert audit JSON to SARIF
        if: ${{ !cancelled() && hashFiles('cargo-audit.json') != '' }}
        run: |
          jq '
            def sev_to_level:
              ascii_downcase
              | if   . == "critical" then "error"
                elif . == "high"     then "error"
                elif . == "medium"   then "warning"
                elif . == "low"      then "note"
                else "warning" end;
            # Vulnerabilities plus the warnings --deny warnings turns into failures
            # (unmaintained, unsound, yanked), so the SARIF matches the job verdict.
            ( [ .vulnerabilities.list[]? | {kind: "vulnerability", advisory, package} ]
              + [ (.warnings // {}) | to_entries[] | .value[]? | {kind, advisory, package} ]
              | map(. + {id: (.advisory.id // "\(.kind)-\(.package.name)")}) ) as $findings
            | {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                "tool": {
                  "driver": {
                    "name": "cargo-audit",
                    "informationUri": "https://github.com/rustsec/rustsec/tree/main/cargo-audit",
                    "rules": (
                      [$findings[]
                        | .id as $id
                        | .kind as $kind
                        | (.advisory // {}) as $a
                        | {
                            "id": $id,
                            "name": $id,
                            "shortDescription": { "text": ($a.title // "\($kind): \(.package.name)") },
                            "fullDescription":  { "text": ($a.description // $a.title // "\($kind): \(.package.name)") },
                            "helpUri": (if $a.id then "https://rustsec.org/advisories/\($a.id).html" else "https://crates.io/crates/\(.package.name)" end),
                            "defaultConfiguration": {
                              "level": (if $kind == "vulnerability" then (($a.severity // "warning") | sev_to_level) else "warning" end)
                            },
                            "properties": {
                              "tags": ["security", "rust", "rustsec", $kind],
                              "security-severity": (
                                if   ($a.severity // "" | ascii_downcase) == "critical" then "9.5"
                                elif ($a.severity // "" | ascii_downcase) == "high"     then "7.5"
                                elif ($a.severity // "" | ascii_downcase) == "medium"   then "5.0"
                                elif ($a.severity // "" | ascii_downcase) == "low"      then "3.0"
                                else "5.0" end
                              )
                            }
                          }
                      ] | unique_by(.id)
                    )
                  }
                },
                "results": (
                  [$findings[]
                    | {
                        "ruleId": .id,
                        "level": (if .kind == "vulnerability" then ((.advisory.severity // "warning") | sev_to_level) else "warning" end),
                        "message": {
                          "text": "\(.package.name) \(.package.version): \(.advisory.title // .kind) (\(.id))"
                        },
                        "locations": [{
                          "physicalLocation": {
                            "artifactLocation": { "uri": "v4/Cargo.lock" },
                            "region": { "startLine": 1 }
                          }
                        }],
                        "partialFingerprints": {
                          "advisory/package/version": "\(.id)/\(.package.name)/\(.package.version)"
                        }
                      }
                  ]
                )
              }]
            }
          ' cargo-audit.json >cargo-audit.sarif
          echo "SARIF results: $(jq '.runs[0].results | length' cargo-audit.sarif)"

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('cargo-audit.sarif') != '' }}
        # Reporting only: the audit step above carries the verdict.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit-v4

      - name: Audit summary
        if: ${{ !cancelled() && hashFiles('cargo-audit.json') != '' }}
        run: |
          {
            echo "## Dependency Audit (v4)"
            echo "- **Vulnerabilities (after ignores):** $(jq '.vulnerabilities.count // 0' cargo-audit.json)"
            echo "- **Denied warnings (after ignores):** $(jq '[(.warnings // {})[]?[]?] | length' cargo-audit.json)"
            echo "- **Exceptions:** \`v4/.cargo/audit.toml\`"
          } >>"$GITHUB_STEP_SUMMARY"

  # ============================================
  # CI Status Check
  # ============================================

  ci-required:
    name: CI v4 Required Checks
    runs-on: ubuntu-latest
    needs:
      - build-test
      - dependency-audit
    if: ${{ always() }}
    steps:
      - name: Check required jobs
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          echo "build-test: $BUILD_TEST"
          echo "dependency-audit: $DEPENDENCY_AUDIT"
          if [[ "$BUILD_TEST" != "success" || "$DEPENDENCY_AUDIT" != "success" ]]; then
            echo "❌ Required CI v4 checks failed"
            exit 1
          fi
          echo "✅ Required CI v4 checks passed"
