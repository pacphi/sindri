name: "v2: CI (shim)"

# This file exists so GitHub triggers the centralized ci-v2.yml
# workflow that lives on the main branch. The actual CI logic is on main —
# changes to it should be made there, not here. The one exception is the
# branch-local npm-audit job below, which audits this branch's lockfiles.

on:
  push:
    branches: [v2]
    paths:
      - 'v2/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/v2/**'
      - '.dockerignore'
      - '.shellcheckrc'
      - '.yamllint.yml'
      - 'Makefile'
  pull_request:
    branches: [v2]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES*.md'
      - '**/*.md'
  workflow_dispatch:

# Permissions must be a SUPERSET of every nested permission the called
# workflow (and its callees) requires. Reusable workflows cannot exceed
# the caller's grant. Keep this list up to date when ci-v2.yml gains new
# permissions.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  pull-requests: write
  issues: write
  security-events: write
  actions: read
  checks: write
  deployments: write
  statuses: write

jobs:
  ci:
    name: CI
    uses: pacphi/sindri/.github/workflows/ci-v2.yml@main
    secrets: inherit

  # Dependency audit for the v2 line (SECURITY.md: each supported branch's CI runs one).
  # Runs on the branch itself, so it needs no change to the centralized ci-v2.yml on main.
  # Exceptions live in v2/audit-ignore; see .github/scripts/v2/npm-audit.sh.
  npm-audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: npm audit --audit-level=high (every package-lock.json)
        run: .github/scripts/v2/npm-audit.sh
