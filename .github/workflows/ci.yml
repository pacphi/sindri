name: "v3: CI (shim)"

# This file exists ONLY so GitHub triggers the centralized ci-v3.yml
# workflow that lives on the main branch. The actual CI logic is on main —
# changes to it should be made there, not here.

on:
  push:
    branches: [v3]
    paths:
      - 'v3/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
      - '.dockerignore'
      - '.npmrc'
      - '.shellcheckrc'
      - '.yamllint.yml'
      - 'Makefile'
  pull_request:
    branches: [v3]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES*.md'
      - '**/*.md'
  workflow_dispatch:

# Permissions must be a SUPERSET of every nested permission the called
# workflow (and its callees) requires. Reusable workflows cannot exceed
# the caller's grant. Keep this list up to date when ci-v3.yml gains new
# permissions.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  pull-requests: write
  issues: write
  security-events: write
  actions: read
  checks: write
  deployments: write
  statuses: write

jobs:
  ci:
    name: CI
    uses: pacphi/sindri/.github/workflows/ci-v3.yml@main
    secrets: inherit

  # Branch-local audit gate. main's ci-v3.yml `security-audit` job only runs on
  # push/dispatch (`if: github.event_name == 'push' || ...`), so it never gates a
  # pull request into v3. This job mirrors that job's commands verbatim so PRs are
  # gated by the same `cargo audit --deny warnings` + v3/audit-ignore check.
  # Drop it once ci-v3.yml runs security-audit on pull_request too.
  security-audit:
    name: Security Audit (PR gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0

      - name: Install cargo-audit
        run: cargo binstall cargo-audit --no-confirm

      - name: Run cargo audit (mirrors main ci-v3.yml security-audit)
        shell: bash
        run: |
          set -euo pipefail
          IGNORE_FILE="v3/audit-ignore"
          if [[ ! -f "$IGNORE_FILE" ]]; then
            echo "No audit-ignore file found at $IGNORE_FILE"
            echo "Running cargo audit without exceptions..."
            cd v3
            exec cargo audit --deny warnings
          fi

          IGNORE_FLAGS=()
          ADVISORY_IDS=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [[ -z "$line" ]] && continue
            IGNORE_FLAGS+=(--ignore "$line")
            ADVISORY_IDS+=("$line")
          done < "$IGNORE_FILE"

          if [[ ${#ADVISORY_IDS[@]} -gt 0 ]]; then
            echo "Ignoring ${#ADVISORY_IDS[@]} advisory exception(s):"
            for id in "${ADVISORY_IDS[@]}"; do
              echo "  - $id"
            done
          fi

          cd v3
          exec cargo audit --deny warnings "${IGNORE_FLAGS[@]}"
